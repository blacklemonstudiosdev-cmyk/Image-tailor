<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <meta
      name="description"
      content="Image Tailor — a professional image editor in the browser. Layers, colour grading, masks, typography and live collaboration. A product by BlackLemon Studios."
    />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=panchang@400,500,700,800&display=swap"

      html,
      body,

        height: 100%;

        font-size: 11px;

        text-transform: uppercase;

      <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
